[project]
name = "hippo"
version = "0.1.0"
description = "Can an agent rediscover nnU-Net? A hill-climbing loop on MSD Task04 Hippocampus with a frozen ruler and a sequestered hold-out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "nibabel>=5.0"]

[project.optional-dependencies]
train = ["torch>=2.2", "monai>=1.3", "mlflow>=2.10"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
